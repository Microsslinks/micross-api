# =============================================================================
#  MicrossAPI / Microsslink 微观互联 — production Docker Compose (hardened)
#  Repository: https://github.com/microsslinks/micross-api
#
#  This is the production-hardened sibling of docker-compose.yml. Differences:
#    1. No `build:` block — pulls pre-built image from ghcr.io (saves 5-8 min
#       vs local compile; ensures the binary in the running container matches
#       what GH Actions published with the matching VERSION).
#    2. Pinned image tags (no `:latest`) — deterministic `docker compose pull`.
#    3. No default passwords — required env vars in `.env` (see step 1 below).
#    4. Port bound to 127.0.0.1 — front with Nginx/Caddy for HTTPS; do NOT
#       expose 3000 to the public internet directly.
#    5. Redis with AOF persistence (--appendonly yes) — survives container
#       restart without data loss.
#    6. SESSION_SECRET required — multi-node deployments need a stable secret;
#       single-node is OK to leave unset (the binary generates one).
#
#  Quick start:
#    1. Create a .env file with required secrets:
#         cat > .env <<EOF
#         POSTGRES_PASSWORD=$(openssl rand -base64 24)
#         REDIS_PASSWORD=$(openssl rand -base64 24)
#         SESSION_SECRET=$(openssl rand -hex 32)
#         MICROSS_VERSION=v0.37.1
#         EOF
#         chmod 600 .env
#    2. (optional) edit micross-api.environment to flip
#         SESSION_COOKIE_SECURE=true once you have HTTPS terminated upstream.
#    3. docker compose -f docker-compose.prod.yml pull
#    4. docker compose -f docker-compose.prod.yml up -d
#    5. curl -s http://localhost:3000/api/status | jq .data.version
#       → "v0.37.1"
#
#  Upgrade to v0.37.2 etc:
#       MICROSS_VERSION=v0.37.2 docker compose -f docker-compose.prod.yml pull
#       MICROSS_VERSION=v0.37.2 docker compose -f docker-compose.prod.yml up -d
#
#  Backup (PostgreSQL):
#       docker exec micross-api-postgres pg_dump -U root micross-api \
#         | gzip > backup-$(date +%F).sql.gz
#
#  Switch to MySQL: comment out the postgres service and depends_on line,
#  uncomment the mysql service block, change SQL_DSN to the MySQL DSN, and
#  bring up the stack.
# =============================================================================

services:
  micross-api:
    # Pulled from ghcr.io — published by .github/workflows/docker-build.yml
    # on every v0.X.Y tag. The image's `common.Version` matches MICROSS_VERSION
    # (verified via `docker run --rm ... --version`).
    image: ghcr.io/microsslinks/micross-api:${MICROSS_VERSION:-v0.37.1}
    container_name: micross-api
    restart: always
    command: --log-dir /app/logs
    # Loopback only — terminate TLS at Nginx/Caddy upstream and forward 127.0.0.1.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Host bind mounts (relative paths assume the compose file's directory).
      # For SQLite mode, ./data holds one-api.db. For Postgres mode, ./data
      # only holds ephemeral files; the DB lives in named volume `pg_data`.
      - ./data:/data
      - ./logs:/app/logs
    environment:
      # All credentials pulled from .env — NEVER hardcode.
      - SQL_DSN=postgresql://root:${POSTGRES_PASSWORD}@postgres:5432/micross-api
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD}@redis:6379
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=micross-api-node-1
      # Set SESSION_SECRET for multi-node deploys; required to be identical
      # across replicas. For single-node, leaving unset is safe (the binary
      # generates a per-process secret that resets on restart — only the
      # refresh/logout OriginGuard will then require session re-issue after
      # restarts).
      - SESSION_SECRET=${SESSION_SECRET:-}
      # Required when SESSION_COOKIE_SECURE=true is enabled below. Listed
      # here as commented to make the intent explicit; uncomment both
      # SESSION_COOKIE_SECURE and SESSION_COOKIE_TRUSTED_URL together once
      # Nginx/Caddy is serving HTTPS.
      # - SESSION_COOKIE_SECURE=true
      # - SESSION_COOKIE_TRUSTED_URL=https://your.domain.com
      # - TRUSTED_PROXIES=127.0.0.1/32
      # - STREAMING_TIMEOUT=300
      # - RELAY_IDLE_CONN_TIMEOUT=90
      # - SYNC_FREQUENCY=60

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - micross-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Generous start_period: cold boot pulls image, runs GORM AutoMigrate
      # (commission_records schema changes in v0.37.1), warms up relay pool.
      start_period: 90s
    # Resource limits. The Go process is memory-hungry under heavy relay
    # streaming; 2G is a sane baseline for small fleets. Bump memory if you
    # see OOMKills in `docker inspect micross-api | grep OOMKilled`.
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    # Pinned minor tag — avoid the floating :latest (future 8.x may break).
    image: redis:7.4-alpine
    container_name: micross-api-redis
    restart: always
    # --appendonly yes gives AOF persistence (survives restart).
    # --save 60 1 also snapshots every 60s if ≥1 key changed.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --save 60 1
    healthcheck:
      # redis-cli -a reads auth from argv. --no-auth-warning suppresses the
      # password-on-cmdline warning that pollutes logs.
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    # No host port mapping — Redis stays inside the Docker network only.
    networks:
      - micross-api-network

  postgres:
    # Pinned minor — postgres:15 is a major-version float that may pick up 15.x→16
    # patches incompatible with old clients.
    image: postgres:15.13-alpine
    container_name: micross-api-postgres
    restart: always
    environment:
      POSTGRES_USER: root
      # The password env var is also consumed by micross-api's SQL_DSN above.
      # Keep them in sync via .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: micross-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d micross-api"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # No host port mapping — DB stays inside the Docker network only.
    # Uncomment only if you need to run psql from outside Docker.
    # ports:
    #   - "127.0.0.1:5432:5432"
    networks:
      - micross-api-network

volumes:
  pg_data:

networks:
  micross-api-network:
    driver: bridge