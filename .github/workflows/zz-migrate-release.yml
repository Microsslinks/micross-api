name: Migrate release assets (temporary)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to migrate (e.g. v0.37.1.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  migrate:
    name: Migrate release from dukaworks/micross-api
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch release notes from old repo
        env:
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" --repo dukaworks/micross-api --json body -q .body > release-body.md
          if [ ! -s release-body.md ]; then
            echo "No release body found, using placeholder"
            echo "Migrated from dukaworks/micross-api@$TAG." > release-body.md
          fi
          echo "---BODY---"
          head -20 release-body.md
          echo "---END---"

      - name: Create release in new repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo microsslinks/micross-api \
            --title "$TAG" \
            --notes-file release-body.md \
            || echo "Release may already exist, continuing"

      - name: Download assets from old repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p assets
          gh release download "$TAG" --repo dukaworks/micross-api --dir assets
          echo "---DOWNLOADED---"
          ls -la assets
          echo "---SIZES---"
          du -sh assets/*

      - name: Upload assets to new repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" --repo microsslinks/micross-api assets/* --clobber

      - name: Verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          echo "=== Final state of new release ==="
          gh release view "$TAG" --repo microsslinks/micross-api --json tagName,assets --jq '.tagName, (.assets | length), (.assets[]?.name)'