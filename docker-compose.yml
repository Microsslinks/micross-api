# =============================================================================
#  MicrossAPI / Microsslink 微观互联 — production Docker Compose
#  Repository: https://github.com/dukaworks/micross-api
#
#  Quick start:
#    1. (optionally) edit this file to change passwords / ports / DSN
#    2. docker compose up -d --build
#    3. open http://localhost:3000
#
#  By default this stack is self-contained: the `micross-api` service is
#  BUILT from this repository via the `build:` block below — no external
#  image pull is required. If you want to use a pre-pushed image instead,
#  set MICROSS_PULL_IMAGE=1 in your shell, or comment out the `build:` block.
#
#  Switching from PostgreSQL to MySQL: see the commented steps in the
#  mysql / postgres sections below.
#
#  ⚠️  IMPORTANT: Change all default passwords before deploying to production!
# =============================================================================

services:
  micross-api:
    # ---- Build from this repository (no external pull required) -------------
    # The `build:` block makes `docker compose up` compile a fresh
    # `dukaworks/micross-api:latest` from ./Dockerfile. If you prefer to pull
    # a pre-built image, comment out the `build:` block and let the `image:`
    # line below resolve via the registry.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Pin the version baked into the binary. Override at build time with:
        #   docker compose build --build-arg VERSION=$(cat VERSION)
        VERSION: ${MICROSS_VERSION:-local}
        GIT_COMMIT: ${MICROSS_GIT_COMMIT:-unknown}
        BUILD_TIME: ${MICROSS_BUILD_TIME:-unknown}
    # Pin the image tag so `docker compose pull` is deterministic.
    # Override at deploy time with:
    #   MICROSS_VERSION=v0.37.1 docker compose pull
    # To fall back to local build, comment out `image:` and run `docker compose build`.
    image: dukaworks/micross-api:${MICROSS_VERSION:-v0.37.1}
    container_name: micross-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:123456@postgres:5432/micross-api # ⚠️ IMPORTANT: Change the password in production!
#      - SQL_DSN=root:123456@tcp(mysql:3306)/micross-api              # Point to the mysql service, uncomment if using MySQL
#      - LOG_SQL_DSN=postgresql://root:123456@postgres:5432/micross-api-log # OPTIONAL: If you want a separate database for logging, uncomment and set this
#      - LOG_SQL_DSN=clickhouse://default:123456@clickhouse:9000/micross_api_logs # OPTIONAL: Use ClickHouse for logs only; also uncomment clickhouse in depends_on and the clickhouse service below
#      - LOG_SQL_CLICKHOUSE_TTL_DAYS=0 # OPTIONAL: ClickHouse log retention days. Unset or 0 disables automatic deletion; set to e.g. 30 to keep 30 days
      - REDIS_CONN_STRING=redis://:123456@redis:6379 # ⚠️ IMPORTANT: Change the password in production!
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=true  # 是否启用批量更新 (Whether to enable batch update)
      - NODE_NAME=micross-api-node-1  # 节点名称，用于审计日志中标识节点身份；多节点/容器部署时建议设置 (Node name used in audit logs; recommended when running multiple instances or in containers)
#      - STREAMING_TIMEOUT=300  # 流模式无响应超时时间，单位秒，默认120秒，如果出现空补全可以尝试改为更大值 （Streaming timeout in seconds, default is 120s. Increase if experiencing empty completions）
#      - RELAY_IDLE_CONN_TIMEOUT=90  # Relay HTTP 客户端空闲连接超时时间，单位秒，默认跟随 Go 标准库，设置为0表示不限制 (Relay HTTP client idle keep-alive timeout in seconds, defaults to Go standard library; set 0 to disable)
#      - SESSION_SECRET=random_string  # 多机部署时设置，必须修改这个随机字符串！！ （multi-node deployment, set this to a random string!!!!!!!）
#      - SESSION_COOKIE_SECURE=true  # true：启用 Secure Refresh Cookie 和严格 refresh/logout OriginGuard；false/未配置：关闭 OriginGuard，仅用于本地 HTTP (true: Secure cookie + strict refresh/logout OriginGuard; false/unset: guard disabled for local HTTP only)
#      - SESSION_COOKIE_TRUSTED_URL=https://example.com,https://admin.example.com  # Secure=true 时必填的精确 HTTPS Origin；不是 relay CORS 白名单，不支持通配符/路径 (Required exact HTTPS origins when Secure=true; not a relay CORS allowlist, no wildcard/path)
#      - TRUSTED_PROXIES=172.20.0.0/16  # 未配置时信任回环/RFC1918/fc00::/7 并告警，none 为严格模式，显式列表替代默认值 (Unset trusts loopback/RFC 1918/fc00::/7 with a warning; none trusts no proxies; an explicit list replaces defaults)
#      - USER_SESSION_ACTIVE_LIMIT=50
#      - USER_SESSION_ISSUANCE_LIMIT=100
#      - USER_SESSION_ISSUANCE_WINDOW_SECONDS=86400  # 不得大于 revoked 保留期 (must not exceed revoked retention)
#      - USER_SESSION_REVOKED_RETENTION_DAYS=7
#      - USER_SESSION_HOURLY_ALERT_THRESHOLD=5000  # 仅告警，不做全局拒绝 (alert only; never globally rejects login)
#      - SYNC_FREQUENCY=60  # Uncomment if regular database syncing is needed
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX  # Google Analytics 的测量 ID (Google Analytics Measurement ID)
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami 网站 ID (Umami Website ID)
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js  # Umami 脚本 URL，默认为官方地址 (Umami Script URL, defaults to the official address)

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
#      - mysql  # Uncomment if using MySQL
#      - clickhouse  # Uncomment if using ClickHouse for LOG_SQL_DSN
    networks:
      - micross-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Resource limits — tune to your VPS. The API process is memory-hungry
    # under load (model streaming buffers, log SQL aggregation). 1G is a sane
    # baseline for small fleets; bump to 2-4G if you see OOMKills.
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:latest
    container_name: micross-api-redis
    restart: always
    command: ["redis-server", "--requirepass", "123456"]  # ⚠️ IMPORTANT: Change this password in production!
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - micross-api-network

  postgres:
    image: postgres:15
    container_name: micross-api-postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456  # ⚠️ IMPORTANT: Change this password in production!
      POSTGRES_DB: micross-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d micross-api"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - micross-api-network
#    ports:
#      - "5432:5432"  # Uncomment if you need to access PostgreSQL from outside Docker

#  mysql:
#    image: mysql:8.2
#    container_name: micross-api-mysql
#    restart: always
#    environment:
#      MYSQL_ROOT_PASSWORD: 123456  # ⚠️ IMPORTANT: Change this password in production!
#      MYSQL_DATABASE: micross-api
#    volumes:
#      - mysql_data:/var/lib/mysql
#    networks:
#      - micross-api-network
#    ports:
#      - "3306:3306"  # Uncomment if you need to access MySQL from outside Docker

#  clickhouse:
#    image: clickhouse/clickhouse-server:24.8
#    container_name: micross-api-clickhouse
#    restart: always
#    environment:
#      CLICKHOUSE_DB: micross_api_logs
#      CLICKHOUSE_USER: default
#      CLICKHOUSE_PASSWORD: 123456  # ⚠️ IMPORTANT: Change this password in production!
#      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
#    volumes:
#      - clickhouse_data:/var/lib/clickhouse
#    networks:
#      - micross-api-network
#    ports:
#      - "8123:8123"  # HTTP interface, uncomment if you need external access
#      - "9000:9000"  # Native interface used by the LOG_SQL_DSN example above

volumes:
  pg_data:
#  mysql_data:
#  clickhouse_data:

# =============================================================================
#  Backup recommendations
# =============================================================================
#  - Postgres (named volume `pg_data`):
#      docker exec micross-api-postgres pg_dump -U root micross-api \
#        | gzip > backup-$(date +%F).sql.gz
#  - Host bind mount `./data` (SQLite mode — when SQL_DSN is unset):
#      This directory also holds license files, exported CSVs, etc.
#      Recommended: daily tarball of `./data` and `./logs`, offsite.
#  - Logs (`./logs`):
#      Rotate at the OS level (logrotate) and/or rely on Docker's json-file
#      log driver size cap:
#        docker run --log-opt max-size=50m --log-opt max-file=5 ...
# =============================================================================

networks:
  micross-api-network:
    driver: bridge